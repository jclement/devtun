version: 2
project_name: devtun

before:
  hooks: [go mod tidy]

builds:
  - id: devtun
    main: ./cmd/devtun
    binary: devtun
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/jclement/devtun/internal/buildinfo.version={{.Version}}
      - -X github.com/jclement/devtun/internal/buildinfo.commit={{.ShortCommit}}
      - -X github.com/jclement/devtun/internal/buildinfo.buildDate={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      # No dev box is a Windows-on-ARM box, and nobody runs the workstation
      # half there either.
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

# The helper binary is fetched by the workstation and executed on a dev box, so
# the release is signed rather than merely checksummed.
signs:
  - cmd: cosign
    # cosign v3 writes a single bundle rather than a separate signature and
    # certificate; the older --output-signature/--output-certificate pair now
    # leaves it trying to open an empty bundle path and failing the release.
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true

# Homebrew distributes prebuilt binaries as casks now; the older `brews`
# (formula) block is deprecated, and the tap already holds casks for the other
# tools here.
homebrew_casks:
  - name: devtun
    binaries: [devtun]
    repository:
      owner: jclement
      name: homebrew-tap
      # GoReleaser accepts only a bare {{ .Env.VAR }} here — no other
      # interpolation — so the "is it configured?" test lives in skip_upload.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Pushing to another repository needs a PAT the default GITHUB_TOKEN cannot
    # provide. Without one the release still publishes its binaries and only the
    # tap update is skipped, rather than failing the whole run.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    directory: Casks
    homepage: https://github.com/jclement/devtun
    description: Your remote dev box, but it behaves like localhost — ports, secrets, SSH agent and browser over one SSH connection
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    # Strip the quarantine flag so a downloaded binary runs without a
    # Gatekeeper prompt. This lives in custom_block rather than hooks.post.install
    # because GoReleaser renders hooks as a `postflight do` block, which Homebrew
    # has deprecated in favour of declarative `postflight_steps`. Step paths
    # resolve against the staged path, hence the bare "devtun" and `chdir: "."`.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "devtun"], chdir: ".", must_succeed: false
        end
      end

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:', Merge pull request]
