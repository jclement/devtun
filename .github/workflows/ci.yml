name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
      - name: format
        run: test -z "$(gofmt -l . | grep -v '^bin/')" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1

  cross:
    # The helper runs on whatever the dev box is, so every target it could be
    # has to keep compiling — a build break here is a host you cannot install
    # onto, discovered at the worst moment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - run: ./scripts/build-all.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - run: go test -tags e2e -count=1 -timeout 20m ./e2e/...
